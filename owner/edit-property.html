<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل عقار | مأوى MAWA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="dashboard-wrapper">
        
        <!-- القائمة الجانبية (Sidebar) -->
        <aside class="dashboard-sidebar">
            <a class="brand" href="../index.html">
                مأوى <span>MAWA</span>
            </a>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> نظرة عامة</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="my-properties.html"><i class="bi bi-house-door"></i> عقاراتي</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="add-property.html"><i class="bi bi-plus-circle"></i> إضافة عقار</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="booking-requests.html"><i class="bi bi-calendar-check"></i> طلبات الحجز</a>
                </li>
                <li class="nav-item mt-4">
                    <a class="nav-link text-danger" href="../index.html"><i class="bi bi-box-arrow-right"></i> تسجيل خروج</a>
                </li>
            </ul>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="dashboard-content">
            
            <!-- الهيدر -->
            <header class="dashboard-header">
                <div>
                    <h4 class="fw-bold mb-1" style="color: var(--mawa-olive);">تعديل العقار</h4>
                    <p class="text-muted mb-0 small">قم بتحديث بيانات العقار ثم احفظ التغييرات.</p>
                </div>
                <a href="my-properties.html" class="btn btn-outline-dark rounded-pill px-4 fw-bold"><i class="bi bi-arrow-right me-1"></i> رجوع</a>
            </header>

            <form>
                <div class="row g-4">
                    <!-- العمود الأيمن: البيانات الأساسية -->
                    <div class="col-lg-8">
                        
                        <!-- معلومات أساسية -->
                        <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
                            <h5 class="fw-bold mb-4" style="color: var(--mawa-olive);"><i class="bi bi-info-circle me-2"></i> المعلومات الأساسية</h5>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small">عنوان العقار</label>
                                <!-- حقل معبأ مسبقاً -->
                                <input type="text" class="form-control bg-light border-0 py-2" value="فيلا حديثة مع مسبح خاص" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">وصف العقار</label>
                                <!-- حقل معبأ مسبقاً -->
                                <textarea class="form-control bg-light border-0 py-2" rows="4" required>استمتع بإقامة لا تُنسى في هذه الفيلا الحديثة والهادئة. تتميز الفيلا بتصميم عصري، مساحات واسعة، وإطلالة رائعة. تحتوي على مسبح خاص، حديقة خارجية، ومكان مخصص للشواء.</textarea>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">نوع العقار</label>
                                    <select class="form-select bg-light border-0 py-2" required>
                                        <option value="house" selected>بيت كامل</option>
                                        <option value="apartment">شقة سكنية</option>
                                        <option value="room">غرفة خاصة</option>
                                        <option value="farm">مزرعة / استراحة</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">السعر لليلة (₪)</label>
                                    <input type="number" class="form-control bg-light border-0 py-2" value="450" min="0" required>
                                </div>
                            </div>
                        </div>

                        <!-- الموقع -->
                        <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
                            <h5 class="fw-bold mb-4" style="color: var(--mawa-olive);"><i class="bi bi-geo-alt me-2"></i> الموقع</h5>
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">المدينة</label>
                                    <select class="form-select bg-light border-0 py-2" required>
                                        <option value="رام الله" selected>رام الله</option>
                                        <option value="نابلس">نابلس</option>
                                        <option value="الخليل">الخليل</option>
                                        <option value="القدس">القدس</option>
                                        <option value="بيت لحم">بيت لحم</option>
                                        <option value="جنين">جنين</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">الحي / المنطقة</label>
                                    <input type="text" class="form-control bg-light border-0 py-2" value="الماصيون" required>
                                </div>
                            </div>
                        </div>

                        <!-- تفاصيل العقار -->
                        <div class="bg-white p-4 rounded-4 shadow-sm">
                            <h5 class="fw-bold mb-4" style="color: var(--mawa-olive);"><i class="bi bi-list-check me-2"></i> تفاصيل العقار والمرافق</h5>
                            
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">عدد الضيوف</label>
                                    <input type="number" class="form-control bg-light border-0 py-2" min="1" value="8" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">غرف النوم</label>
                                    <input type="number" class="form-control bg-light border-0 py-2" min="1" value="4" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small">الحمامات</label>
                                    <input type="number" class="form-control bg-light border-0 py-2" min="1" value="3" required>
                                </div>
                            </div>

                            <label class="form-label fw-bold small mb-2">المرافق المتوفرة</label>
                            <div class="row g-2">
                                <div class="col-6 col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="wifi" checked>
                                        <label class="form-check-label" for="wifi"><i class="bi bi-wifi me-1"></i> واي فاي</label>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="pool" checked>
                                        <label class="form-check-label" for="pool"><i class="bi bi-water me-1"></i> مسبح</label>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="parking" checked>
                                        <label class="form-check-label" for="parking"><i class="bi bi-car-front me-1"></i> موقف سيارات</label>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="ac" checked>
                                        <label class="form-check-label" for="ac"><i class="bi bi-snow me-1"></i> تكييف</label>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="kitchen">
                                        <label class="form-check-label" for="kitchen"><i class="bi bi-cup-hot me-1"></i> مطبخ مجهز</label>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="tv">
                                        <label class="form-check-label" for="tv"><i class="bi bi-tv me-1"></i> تلفاز</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- العمود الأيسر: الصور والحفظ -->
                    <div class="col-lg-4">
                        
                        <!-- رفع الصور -->
                        <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
                            <h5 class="fw-bold mb-4" style="color: var(--mawa-olive);"><i class="bi bi-images me-2"></i> صور العقار</h5>
                            
                            <div class="border border-2 border-dashed rounded-3 p-4 text-center bg-light position-relative" style="border-style: dashed !important; cursor: pointer;">
                                <i class="bi bi-cloud-arrow-up fs-1 text-muted mb-2 d-block"></i>
                                <p class="fw-bold mb-1">إضافة صور جديدة</p>
                                <input type="file" class="position-absolute top-0 start-0 w-100 h-100 opacity-0" multiple accept="image/*" style="cursor: pointer;">
                            </div>

                            <!-- معاينة الصور الحالية -->
                            <div class="row g-2 mt-3">
                                <div class="col-4">
                                    <div class="position-relative">
                                        <img src="../img/p7.jpg" onerror="this.src='https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=150&q=80'" class="rounded-2 w-100" style="height: 70px; object-fit: cover;">
                                        <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1 p-0 px-1 rounded-circle" style="font-size: 10px;"><i class="bi bi-x"></i></button>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="position-relative">
                                        <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=150&q=80" class="rounded-2 w-100" style="height: 70px; object-fit: cover;">
                                        <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1 p-0 px-1 rounded-circle" style="font-size: 10px;"><i class="bi bi-x"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- زر الحفظ -->
                        <div class="bg-white p-4 rounded-4 shadow-sm">
                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 rounded-3 mb-2">
                                <i class="bi bi-check-circle me-2"></i> حفظ التعديلات
                            </button>
                            <a href="my-properties.html" class="btn btn-light w-100 py-2 fw-bold text-muted">إلغاء</a>
                        </div>

                    </div>
                </div>
            </form>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
