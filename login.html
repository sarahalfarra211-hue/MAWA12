
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | مأوى MAWA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <div class="container-fluid p-0">
        <div class="row g-0 vh-100">
            
            <!-- الفورم -->
            <div class="col-md-6 d-flex align-items-center justify-content-center bg-white">
                <div class="auth-form-container p-4 p-md-5 w-100" style="max-width: 450px;">
                    
                    <div class="text-center mb-5">
                        <a class="navbar-brand fw-bold" href="index.html" style="color: var(--mawa-olive); font-size: 2.5rem;">
                            مأوى <span style="color: var(--mawa-dusty-pink);">MAWA</span>
                        </a>
                        <h3 class="fw-bold mt-3">مرحباً بعودتك!</h3>
                    </div>

                    <form>
                        <div class="mb-4">
                            <label class="form-label fw-bold small">البريد الإلكتروني</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-light border-0 py-2" placeholder="name@example.com" required>
                            </div>
                        </div>
                        
                        <!-- حقل الباسورد مع زر العين -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small d-flex justify-content-between">
                                <span>كلمة المرور</span>
                                <a href="#" class="text-decoration-none" style="color: var(--mawa-dusty-pink);">نسيت كلمة المرور؟</a>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-light border-0 py-2" id="passwordInput" placeholder="••••••••" required>
                                <button class="btn btn-light bg-light border-0" type="button" id="togglePassword">
                                    <i class="bi bi-eye-slash" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">تذكرني</label>
                        </div>

                        <!-- زر الدخول، حالياً يوجه للرئيسية لأننا بنجرب التصميم فقط -->
                        <a href="index.html" class="btn btn-primary w-100 py-3 fw-bold fs-5 rounded-3 mb-4 d-block"> تسجيل الدخول </a>
                        
                        <p class="text-center text-muted">
                            ليس لديك حساب؟ <a href="register.html" class="fw-bold text-decoration-none" style="color: var(--mawa-olive);">أنشئ حساباً جديداً</a>
                        </p>
                    </form>

                </div>
            </div>

            <!-- الصورة -->
            <div class="col-md-6 d-none d-md-block auth-image-section">
                <div class="h-100 w-100 d-flex flex-column justify-content-end p-5 text-white" style="background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);">
                    <h2 class="fw-bold display-5 mb-3">اكتشف مأواك المثالي</h2>
                    <p class="lead">آلاف العقارات المميزة بانتظارك في جميع مدن فلسطين.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- سكربت زر العين -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');

        if (togglePassword) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if (type === 'text') {
                    eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
                } else {
                    eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
                }
            });
        }
    </script>
</body>
</html>
