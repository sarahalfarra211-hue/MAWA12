<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | مأوى MAWA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <div class="container-fluid p-0">
        <div class="row g-0 vh-100">
            
            <!-- الجهة اليمنى: الصورة -->
            <div class="col-md-5 d-none d-md-block auth-image-section-register">
                <div class="h-100 w-100 d-flex flex-column justify-content-end p-5 text-white" style="background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);">
                    <h2 class="fw-bold display-5 mb-3">انضم إلى مجتمع مأوى</h2>
                    <p class="lead">سواء كنت باحثاً عن بيت، أو مالكاً لعقار، مكانك هنا.</p>
                </div>
            </div>

            <!-- الجهة اليسرى: الفورم -->
            <div class="col-md-7 d-flex align-items-center justify-content-center bg-white overflow-auto">
                <div class="auth-form-container p-4 p-md-5 w-100 my-4" style="max-width: 550px;">
                    
                    <div class="text-center mb-4">
                        <a class="navbar-brand fw-bold" href="index.html" style="color: var(--mawa-olive); font-size: 2.5rem;">
                            مأوى <span style="color: var(--mawa-dusty-pink);">MAWA</span>
                        </a>
                        <h3 class="fw-bold mt-3">أنشئ حسابك الآن</h3>
                    </div>

                    <!-- تمت إضافة id="registerForm" للفورم -->
                    <form id="registerForm">
                        
                        <!-- اختيار نوع الحساب -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small">أنا أسجل بصفتي:</label>
                            <div class="d-flex gap-3">
                                <div class="flex-fill">
                                    <input type="radio" class="btn-check" name="accountType" id="tenant" checked>
                                    <label class="btn btn-outline-dark w-100 rounded-3 py-2 fw-bold" for="tenant"><i class="bi bi-person"></i> مستأجر</label>
                                </div>
                                <div class="flex-fill">
                                    <input type="radio" class="btn-check" name="accountType" id="owner">
                                    <label class="btn btn-outline-dark w-100 rounded-3 py-2 fw-bold" for="owner"><i class="bi bi-house"></i> مالك عقار</label>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">الاسم الكامل</label>
                                <input type="text" class="form-control bg-light border-0 py-2" placeholder="سارة زاهر " required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">رقم الهاتف</label>
                                <input type="tel" class="form-control bg-light border-0 py-2" placeholder="059xxxxxxx" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">البريد الإلكتروني</label>
                            <input type="email" class="form-control bg-light border-0 py-2" placeholder="name@example.com" required>
                        </div>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">كلمة المرور</label>
                                <input type="password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">تأكيد كلمة المرور</label>
                                <input type="password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label text-muted" for="terms">
                                أوافق على <a href="#" class="text-decoration-none" style="color: var(--mawa-dusty-pink);">الشروط والأحكام</a> و <a href="#" class="text-decoration-none" style="color: var(--mawa-dusty-pink);">سياسة الخصوصية</a>
                            </label>
                        </div>

                        <!-- تم تحويل الزر إلى submit -->
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 rounded-3 mb-4 d-block">
                            إنشاء الحساب
                        </button>

                        <p class="text-center text-muted">
                            لديك حساب بالفعل؟ <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--mawa-olive);">تسجيل الدخول</a>
                        </p>
                    </form>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- سكربت التوجيه حسب نوع الحساب -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // نمنع إرسال الفورم العادي
            
            // نشوف أي زر راديو المستخدم مختار (tenant أو owner)
            const selectedRole = document.querySelector('input[name="accountType"]:checked').id;
            
            // نوجه المستخدم حسب اختياره
            if (selectedRole === 'owner') {
                window.location.href = 'owner/dashboard.html'; // صفحة المالك
            } else {
                window.location.href = 'tenant/dashboard.html'; // صفحة المستأجر
            }
        });
    </script>
</body>
</html>
