<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المفضلة | مأوى MAWA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- الناف بار -->
    <nav class="navbar navbar-expand-lg navbar-light scrolled-nav sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" style="color: var(--mawa-olive); font-size: 1.8rem;">
                مأوى <span style="color: var(--mawa-dusty-pink);">MAWA</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-bold">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link" href="listings.html">العقارات</a></li>
                    <li class="nav-item"><a class="nav-link active" href="favorites.html">المفضلة</a></li>
                     <li class="nav-item"><a class="nav-link" href="contact.html">تواصل معنا</a></li>
                </ul>
                <div class="d-flex gap-2 align-items-center">
                    <a href="login.html" class="btn btn-outline-dark rounded-pill px-4 fw-bold">تسجيل الدخول</a>
                    <a href="register.html" class="btn btn-primary rounded-pill px-4 fw-bold">أضف عقارك</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- محتوى صفحة المفضلة -->
    <div class="container py-5 my-4">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 class="fw-bold mb-1" style="color: var(--mawa-olive);">قائمة المفضلة</h2>
                <p class="text-muted mb-0">العقارات التي قمت بحفظها للرجوع إليها لاحقاً</p>
            </div>
        </div>

        <!-- شبكة العقارات المحفوظة (يتعبى بالجافاسكريبت) -->
        <div class="row g-4" id="favoritesGrid">
            <!-- المحتوى رح يطلع هون أوتوماتيك -->
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="py-4 mt-5" style="background-color: #eae5d9;">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2024 منصة مأوى MAWA. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- سكربت خاص بصفحة المفضلة -->
    <script>
        // قاعدة بيانات وهمية للعقارات
        const allProperties = [
            { id: '1', title: 'فيلا حديثة', city: 'رام الله - الماصيون', price: 450, rating: '4.9', image: 'img/p7.jpg', fallback: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=600&q=80' },
            { id: '2', title: 'شقة أنيقة', city: 'نابلس - رفيديا', price: 250, rating: '4.7', image: 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80', fallback: '' },
            { id: '3', title: 'استراحة مزرعة', city: 'الخليل - حلحول', price: 600, rating: '5.0', image: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=600&q=80', fallback: '' }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const favoritesGrid = document.getElementById('favoritesGrid');
            let favorites = JSON.parse(localStorage.getItem('mawaFavorites')) || [];

            if (favorites.length === 0) {
                // إذا فاضية
                favoritesGrid.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-heartbreak fs-1 text-muted mb-3 d-block"></i>
                        <h4 class="fw-bold text-muted">قائمتك فارغة حالياً</h4>
                        <p class="text-muted">لم تقم بحفظ أي عقار بعد.</p>
                        <a href="listings.html" class="btn btn-primary rounded-pill mt-3 px-4">تصفح العقارات</a>
                    </div>
                `;
            } else {
                // إذا فيها عقارات، بنعرضها
                favorites.forEach(favId => {
                    const prop = allProperties.find(p => p.id === favId);
                    
                    if (prop) {
                        const imgSrc = prop.image;
                        const onErrorAttr = prop.fallback ? `onerror="this.src='${prop.fallback}'"` : '';
                        
                        favoritesGrid.innerHTML += `
                            <div class="col-md-6 col-lg-4">
                                <div class="card property-card border-0 shadow-sm rounded-4 h-100">
                                    <div class="position-relative overflow-hidden rounded-top-4">
                                        <img src="${imgSrc}" ${onErrorAttr} class="card-img-top property-img" style="height: 220px; object-fit: cover;" alt="${prop.title}">
                                        <!-- زر الحذف من المفضلة -->
                                        <button class="btn btn-light position-absolute top-0 end-0 m-3 rounded-circle shadow-sm remove-fav" data-id="${prop.id}"><i class="bi bi-heart-fill text-danger"></i></button>
                                    </div>
                                    <div class="card-body p-4">
                                        <div class="d-flex justify-content-between mb-2">
                                            <h5 class="card-title fw-bold mb-0">${prop.title}</h5>
                                            <span class="badge bg-warning text-dark"><i class="bi bi-star-fill"></i> ${prop.rating}</span>
                                        </div>
                                        <p class="text-muted mb-3"><i class="bi bi-geo-alt"></i> ${prop.city}</p>
                                        <div class="d-flex justify-content-between align-items-center mt-3 border-top pt-3">
                                            <span class="fw-bold fs-5" style="color: var(--mawa-dusty-pink);">₪ ${prop.price} <small class="text-muted fs-6 fw-normal">/ ليلة</small></span>
                                            <a href="property-details.html" class="btn btn-primary btn-sm rounded-pill px-3 fw-bold">التفاصيل</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                });

                // تفعيل زر الحذف من المفضلة
                const removeButtons = document.querySelectorAll('.remove-fav');
                removeButtons.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idToRemove = this.getAttribute('data-id');
                        let currentFavs = JSON.parse(localStorage.getItem('mawaFavorites')) || [];
                        
                        // نحذف الـ ID
                        currentFavs = currentFavs.filter(id => id !== idToRemove);
                        localStorage.setItem('mawaFavorites', JSON.stringify(currentFavs));
                        
                        // نحدث الصفحة عشان يختفي الكرت
                        location.reload();
                    });
                });
            }
        });
    </script>
</body>
</html>
