<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | مأوى MAWA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="dashboard-wrapper">
        
        <!-- القائمة الجانبية (Sidebar) -->
        <aside class="dashboard-sidebar">
            <a class="brand" href="../index.html">
                مأوى <span>MAWA</span>
            </a>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> نظرة عامة</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="my-bookings.html"><i class="bi bi-calendar-check"></i> حجوزاتي</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="../favorites.html"><i class="bi bi-heart"></i> المفضلة</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="profile.html"><i class="bi bi-person"></i> الملف الشخصي</a>
                </li>
                <li class="nav-item mt-4">
                    <a class="nav-link text-danger" href="../index.html"><i class="bi bi-box-arrow-right"></i> تسجيل خروج</a>
                </li>
            </ul>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="dashboard-content">
            
            <!-- الهيدر -->
            <header class="dashboard-header">
                <div>
                    <h4 class="fw-bold mb-1" style="color: var(--mawa-olive);">الملف الشخصي</h4>
                    <p class="text-muted mb-0 small">قم بإدارة بياناتك الشخصية وإعدادات الحساب.</p>
                </div>
            </header>

            <div class="row g-4">
                
                <!-- العمود الأيمن: فورم البيانات -->
                <div class="col-lg-8">
                    
                    <!-- البيانات الأساسية -->
                    <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
                        <h5 class="fw-bold mb-4" style="color: var(--mawa-olive);">البيانات الأساسية</h5>
                        
                        <form>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">الاسم الكامل</label>
                                    <input type="text" class="form-control bg-light border-0 py-2" value="سارة زاهر" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">رقم الهاتف</label>
                                    <input type="tel" class="form-control bg-light border-0 py-2" value="0599123456" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">البريد الإلكتروني</label>
                                <input type="email" class="form-control bg-light border-0 py-2" value="sara@example.com" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small">نبذة عنك (اختياري)</label>
                                <textarea class="form-control bg-light border-0 py-2" rows="3" placeholder="اكتب نبذة قصيرة عنك..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold py-2">حفظ التغييرات</button>
                        </form>
                    </div>

                    <!-- تغيير كلمة المرور -->
                    <div class="bg-white p-4 rounded-4 shadow-sm">
                        <h5 class="fw-bold mb-4" style="color: var(--mawa-olive);">تغيير كلمة المرور</h5>
                        
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">كلمة المرور الحالية</label>
                                <input type="password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">كلمة المرور الجديدة</label>
                                    <input type="password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">تأكيد كلمة المرور</label>
                                    <input type="password" class="form-control bg-light border-0 py-2" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-outline-dark rounded-pill px-5 fw-bold py-2">تحديث كلمة المرور</button>
                        </form>
                    </div>
                </div>

                <!-- العمود الأيسر: الصورة والإعدادات -->
                <div class="col-lg-4">
                    
                    <!-- الصورة الشخصية -->
                    <div class="bg-white p-4 rounded-4 shadow-sm text-center mb-4">
                        <div class="position-relative d-inline-block mb-3">
                            <img src="https://i.pravatar.cc/150?img=5" class="rounded-circle shadow-sm" width="120" height="120" alt="صورة المستأجر">
                            <button class="btn btn-primary rounded-circle position-absolute bottom-0 end-0 p-2" style="width: 35px; height: 35px;">
                                <i class="bi bi-camera" style="font-size: 14px;"></i>
                            </button>
                        </div>
                        <h5 class="fw-bold mb-1">سارة زاهر</h5>
                        <p class="text-muted small mb-0">مستأجر • عضو منذ 2024</p>
                    </div>

                    <!-- إعدادات الحساب -->
                    <div class="bg-white p-4 rounded-4 shadow-sm">
                        <h6 class="fw-bold mb-3" style="color: var(--mawa-olive);">إعدادات الحساب</h6>
                        <ul class="list-unstyled mb-0">
                            <li class="d-flex justify-content-between align-items-center py-2 border-bottom">
                                <span class="small">إشعارات البريد الإلكتروني</span>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" checked>
                                </div>
                            </li>
                            <li class="d-flex justify-content-between align-items-center py-2 border-bottom">
                                <span class="small">رسائل التذكير بالحجوزات</span>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" checked>
                                </div>
                            </li>
                            <li class="d-flex justify-content-between align-items-center py-2">
                                <span class="small">عروض وخصومات</span>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox">
                                </div>
                            </li>
                        </ul>
                        <hr>
                        <button class="btn btn-outline-danger w-100 rounded-pill fw-bold py-2 mt-2">حذف الحساب نهائياً</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
